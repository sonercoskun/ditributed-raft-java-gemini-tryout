<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Raft Cluster Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <meta http-equiv="refresh" content="2"> <!-- Her 2 saniyede bir otomatik yenile -->
</head>
<body class="bg-light p-4">
<div class="container">
    <h2 class="mb-4">🚀 Raft Cluster Control Panel</h2>

    <!-- Düğüm Durumu Kartı -->
    <div class="card mb-4 shadow-sm">
        <div class="card-header bg-primary text-white font-weight-bold">Düğüm Bilgileri</div>
        <div class="card-body">
            <p><strong>Node ID:</strong> <span th:text="${nodeId}">-</span></p>
            <p><strong>Mevcut Rol (Role):</strong>
                <span class="badge"
                      th:classappend="${role.name() == 'LEADER' ? 'bg-success' : (role.name() == 'CANDIDATE' ? 'bg-warning' : 'bg-secondary')}"
                      th:text="${role}">FOLLOWER</span>
            </p>
            <p><strong>Mevcut Term:</strong> <span th:text="${term}">0</span></p>
            <p><strong>Aktif Leader ID:</strong> <span class="fw-bold text-primary" th:text="${leaderId}">Henüz Yok</span></p>
        </div>
    </div>

    <!-- Komut Gönderme Formu -->
    <div class="card mb-4 shadow-sm" th:if="${role.name() == 'LEADER'}">
        <div class="card-header bg-success text-white">Yeni Komut Ekle (WAL Log)</div>
        <div class="card-body">
            <form action="/raft/command" method="post" class="row g-3" onsubmit="submitCommand(event)">
                <div class="col-auto">
                    <input type="text" id="commandInput" class="form-control" placeholder="Örn: SET key=value" required>
                </div>
                <div class="col-auto">
                    <button type="submit" class="btn btn-primary">Lidere Gönder</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Log Geçmişi -->
    <div class="card shadow-sm">
        <div class="card-header bg-dark text-white">Replike Edilmiş Loglar (WAL Entries)</div>
        <div class="card-body">
            <table class="table table-striped table-hover">
                <thead>
                <tr>
                    <th>Index</th>
                    <th>Term</th>
                    <th>Command</th>
                    <th>Config Change?</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="entry : ${logs}">
                    <td th:text="${entry.index}">1</td>
                    <td th:text="${entry.term}">1</td>
                    <td th:text="${entry.command}">SET A=10</td>
                    <td th:text="${entry.isConfiguration ? 'EVET (Joint)' : 'HAYIR'}">HAYIR</td>
                </tr>
                <tr th:if="${#lists.isEmpty(logs)}">
                    <td colspan="4" class="text-center text-muted">Henüz kayıtlı log yok.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    function submitCommand(e) {
        e.preventDefault();
        const command = document.getElementById('commandInput').value;
        fetch('/raft/command', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({command: command})
        }).then(() => location.reload());
    }
</script>
</body>
</html>
